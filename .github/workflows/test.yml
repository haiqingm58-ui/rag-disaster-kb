name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt
          pip install pytest

      - name: Byte-compile source
        run: |
          python -m compileall -q app app_server src scripts

      - name: Run FastAPI tests
        env:
          APP_ENV: development
        run: |
          python -m pytest tests/test_fastapi_app.py -q
